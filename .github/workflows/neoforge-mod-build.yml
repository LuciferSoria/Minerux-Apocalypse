name: NeoForge mod build (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-guard/neoforge-mod/**'
      - 'server-guard/src/main/java/**'
      - '.github/workflows/neoforge-mod-build.yml'
  pull_request:
    paths:
      - 'server-guard/neoforge-mod/**'
      - 'server-guard/src/main/java/**'
      - '.github/workflows/neoforge-mod-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package NeoForge server mod
        working-directory: server-guard/neoforge-mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Validate packaged mod before publishing artifact
        shell: bash
        run: |
          shopt -s nullglob
          jars=(server-guard/neoforge-mod/build/libs/*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one development JAR, got ${#jars[@]}" >&2
            exit 1
          fi
          python3 server-guard/neoforge-mod/verify_jar.py "${jars[@]}"
      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: minerux-neoforge-guard-development
          path: server-guard/neoforge-mod/build/libs/*.jar
          if-no-files-found: error
