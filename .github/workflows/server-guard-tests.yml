name: Server guard Java tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-guard/**'
      - '.github/workflows/server-guard-tests.yml'
  pull_request:
    paths:
      - 'server-guard/**'
      - '.github/workflows/server-guard-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run all server authorization tests
        shell: bash
        run: bash server-guard/verify.sh
