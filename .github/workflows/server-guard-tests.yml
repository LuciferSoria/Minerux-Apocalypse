name: Server guard Java tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server-guard/**'
      - '.github/workflows/server-guard-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile server-side authorization adapter
        shell: bash
        run: |
          mkdir -p server-guard/out
          javac -Xlint:all -d server-guard/out \
            server-guard/src/main/java/dev/minerux/guard/BetaAccessClient.java \
            server-guard/src/main/java/dev/minerux/guard/LoginAccessGate.java \
            server-guard/src/main/java/dev/minerux/guard/LoginCheckWorkers.java \
            server-guard/src/main/java/dev/minerux/guard/ServerGuardConfig.java \
            server-guard/src/main/java/dev/minerux/guard/ServerGuardPreflight.java \
            server-guard/src/main/java/dev/minerux/guard/AuthorizationService.java \
            server-guard/src/test/java/dev/minerux/guard/BetaAccessClientTest.java \
            server-guard/src/test/java/dev/minerux/guard/BetaAccessContractTest.java \
            server-guard/src/test/java/dev/minerux/guard/LoginAccessGateTest.java \
            server-guard/src/test/java/dev/minerux/guard/LoginCheckWorkersTest.java \
            server-guard/src/test/java/dev/minerux/guard/ServerGuardConfigTest.java \
            server-guard/src/test/java/dev/minerux/guard/AuthorizationServiceTest.java
      - name: Run fail-closed authorization tests
        run: |
          java -cp server-guard/out dev.minerux.guard.BetaAccessClientTest
          java -cp server-guard/out dev.minerux.guard.BetaAccessContractTest
          java -cp server-guard/out dev.minerux.guard.LoginAccessGateTest
          java -cp server-guard/out dev.minerux.guard.LoginCheckWorkersTest
          java -cp server-guard/out dev.minerux.guard.ServerGuardConfigTest
          java -cp server-guard/out dev.minerux.guard.AuthorizationServiceTest
      - name: Verify preflight rejects invalid invocation
        shell: bash
        run: |
          set +e
          java -cp server-guard/out dev.minerux.guard.ServerGuardPreflight >preflight.out 2>&1
          status=$?
          set -e
          test "$status" -eq 3
          if grep -E 'token|https://' preflight.out; then
            echo "Unexpected sensitive output"
            exit 1
          fi
